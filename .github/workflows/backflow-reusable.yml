name: backflow-reusable

# Org-shared REUSABLE backflow workflow. Each repo adds a thin caller
# (.github/workflows/backflow-main-into-test.yml) that triggers on push to main
# and/or test and `uses:` this workflow. When test does not contain main as an
# ancestor, this heals ancestry.
#
# ## Durable land path (2026-08-02)
#
# PRIMARY: GitHub merges API with base=test head=main — a real two-parent merge
# commit, signed server-side (RS-3). No human PR merge button. Squash is
# impossible on this path (there is no PR merge for a human to mis-click).
#
# Proven 2026-08-02 after #2385 and #2388 were squash-merged (1 parent each),
# leaving test 1 commit behind main (f9157f0b4) and blocking promotion-gate.
# Soft dual (label + instructions) cannot stop the UI default of Squash.
#
# FALLBACK: if direct land is blocked (permissions / rare ruleset edge), open
# the chore/backflow-main-into-test PR and enable auto-merge with mergeMethod
# MERGE only (never squash). Humans must not squash; auto-merge removes the
# click. If auto-merge cannot be enabled, the PR body still requires --merge.
#
# Auth: GitHub App installation token (actions/create-github-app-token) instead of
# GITHUB_TOKEN — org blocks GITHUB_TOKEN from creating PRs; App has Contents +
# Pull requests r/w. Creds: caller BACKFLOW_APP_ID / BACKFLOW_APP_PRIVATE_KEY.
#
# Hardening retained:
#   - empty-GH_TOKEN guard on any PR step
#   - state-aware PR lookup (CLOSED-not-merged reopen)
#   - signed merges API (not local git merge)
#   - fetch failures fail RED
#   - set -euo pipefail; merged/landed only after confirmed API success
#   - re-fetch latest main before land; no-op if concurrent heal already won
#
# Caller template:
#   on:
#     push: { branches: [main, test] }
#     pull_request: { branches: [test] }
#   jobs:
#     backflow:
#       uses: RevealUIStudio/.github/.github/workflows/backflow-reusable.yml@<sha>
#       secrets:
#         BACKFLOW_APP_ID: ${{ secrets.BACKFLOW_APP_ID }}
#         BACKFLOW_APP_PRIVATE_KEY: ${{ secrets.BACKFLOW_APP_PRIVATE_KEY }}
#
# pull_request on test runs job `backflow-current` (required-check name
# `backflow / backflow-current`): fail other PRs into test while origin/test
# does not contain origin/main, so agents cannot race the auto-backflow.
# The backflow PR head `chore/backflow-main-into-test` is allowed through.
# Land job runs only on push.

on:
  workflow_call:
    secrets:
      BACKFLOW_APP_ID:
        description: Numeric App ID for the configured backflow GitHub App.
        required: true
      BACKFLOW_APP_PRIVATE_KEY:
        description: Private key (PEM) for that same configured backflow GitHub App.
        required: true

permissions:
  contents: read # all writes go through the App token, not GITHUB_TOKEN

jobs:
  backflow:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BACKFLOW_APP_ID }}
          private-key: ${{ secrets.BACKFLOW_APP_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Check if test needs backflow
        id: check
        run: |
          set -euo pipefail

          exists=0
          git ls-remote --exit-code origin test >/dev/null 2>&1 || exists=$?
          if [ "$exists" -eq 2 ]; then
            echo "::warning::No 'test' branch on origin — skipping backflow"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$exists" -ne 0 ]; then
            echo "::error title=Backflow ls-remote failed::Could not query origin for 'test' (rc=$exists). Infra error — failing loudly instead of reporting a false 'no backflow needed'."
            exit 1
          fi

          fetched=false
          for attempt in 1 2 3; do
            if git fetch origin test 2>/dev/null; then fetched=true; break; fi
            echo "::warning::git fetch origin test failed (attempt $attempt/3); retrying..."
            sleep "$((attempt * 5))"
          done
          if [ "$fetched" != true ]; then
            echo "::error title=Backflow fetch failed::Could not fetch origin/test after 3 attempts."
            exit 1
          fi

          if git merge-base --is-ancestor origin/main origin/test; then
            echo "test already contains main — no backflow needed ✓"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            behind=$(git rev-list --count origin/test..origin/main)
            echo "test is $behind commit(s) behind main"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "behind=$behind" >> "$GITHUB_OUTPUT"
          fi

      - name: Land main into test (merges API, two-parent)
        if: steps.check.outputs.needed == 'true'
        id: land
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Backflow App token empty::GH_TOKEN is empty — refusing to proceed."
            exit 1
          fi

          git fetch origin main test
          if git merge-base --is-ancestor origin/main origin/test; then
            echo "::notice::test already contains main (healed since check) — nothing to land."
            echo "landed=true" >> "$GITHUB_OUTPUT"
            echo "fallback_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          behind=$(git rev-list --count origin/test..origin/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"

          missing=$(git log -20 --oneline origin/test..origin/main)
          {
            echo "Merge main into test"
            echo ""
            echo "Auto-landed by the shared backflow-reusable workflow after main"
            echo "moved forward (or after a squash-merged backflow stripped parentage)."
            echo ""
            echo "Two-parent merge via GitHub merges API (NOT squash) so main's"
            echo "parentage is preserved and promotion-gate passes. Signed"
            echo "server-side for require-signed-commits (RS-3)."
            echo ""
            echo "Missing commits backflowed:"
            echo "$missing"
          } > /tmp/merge-msg.txt

          # PRIMARY: land directly on test. No human PR merge button → no squash.
          body="$(jq -n --rawfile msg /tmp/merge-msg.txt \
            '{base:"test", head:"main", commit_message:$msg}')"
          if echo "$body" | gh api -X POST "repos/$REPO/merges" --input - \
               >/tmp/land-resp.json 2>/tmp/land-err.txt; then
            sha=$(jq -r '.sha // empty' /tmp/land-resp.json)
            echo "landed=true" >> "$GITHUB_OUTPUT"
            echo "fallback_pr=false" >> "$GITHUB_OUTPUT"
            echo "Signed two-parent land on test: ${sha:-already up to date}"
            # Close any open manual backflow PR (obsolete after direct land).
            open_pr=$(gh pr list --repo "$REPO" --base test --head chore/backflow-main-into-test \
              --state open --json number --jq '.[0].number // empty' || true)
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --repo "$REPO" --comment \
                "Closed: ancestry auto-landed on \`test\` via merges API (\`${sha:-\$tip}\`). No human merge required." \
                || echo "::warning::Could not close obsolete backflow PR #$open_pr"
            fi
            exit 0
          fi

          err=$(cat /tmp/land-err.txt)
          if echo "$err" | grep -qi 'conflict'; then
            echo "::error title=Backflow merge conflict::Direct land hit content conflicts. Resolve manually: git fetch origin && git checkout test && git merge --no-ff origin/main && resolve && git push origin test"
            exit 1
          fi

          # FALLBACK: permissions/ruleset blocked direct land → PR + auto-merge MERGE.
          echo "::warning title=Direct land blocked::merges API base=test failed ($err). Falling back to PR + auto-merge (merge method only)."
          echo "landed=false" >> "$GITHUB_OUTPUT"
          echo "fallback_pr=true" >> "$GITHUB_OUTPUT"

      - name: Fallback — chore branch + PR + auto-merge (merge only)
        if: steps.check.outputs.needed == 'true' && steps.land.outputs.fallback_pr == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BEHIND: ${{ steps.land.outputs.behind || steps.check.outputs.behind }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Backflow App token empty::GH_TOKEN is empty — refusing PR fallback."
            exit 1
          fi

          git fetch origin main test
          if git merge-base --is-ancestor origin/main origin/test; then
            echo "test already contains main — skip fallback PR"
            exit 0
          fi

          missing=$(git log -20 --oneline origin/test..origin/main)
          {
            echo "Merge main into test"
            echo ""
            echo "Fallback backflow: direct merges API land was blocked; this PR"
            echo "carries a two-parent merge of main into test tip."
            echo ""
            echo "Auto-merge is enabled with mergeMethod=MERGE only."
            echo "Do NOT squash-merge — squash strips main parentage."
            echo ""
            echo "Missing commits:"
            echo "$missing"
          } > /tmp/merge-msg.txt

          git push origin --force \
            "$(git rev-parse origin/test)":refs/heads/chore/backflow-main-into-test

          body="$(jq -n --rawfile msg /tmp/merge-msg.txt \
            '{base:"chore/backflow-main-into-test", head:"main", commit_message:$msg}')"
          if ! echo "$body" | gh api -X POST "repos/$REPO/merges" --input - \
               >/tmp/merge-resp.json 2>/tmp/merge-err.txt; then
            if grep -qi 'conflict' /tmp/merge-err.txt; then
              echo "::error title=Backflow merge conflict::Fallback branch merge hit conflicts. Resolve manually on test."
            else
              echo "::error title=Backflow merge failed::merges API error: $(cat /tmp/merge-err.txt)"
            fi
            exit 1
          fi
          echo "Signed merge on chore branch: $(jq -r '.sha // "(up to date)"' /tmp/merge-resp.json)"

          title="chore(test): backflow main into test ($BEHIND commit(s) behind)"
          {
            echo "## Summary"
            echo ""
            echo "Fallback backflow PR: direct land onto \`test\` was blocked; this PR must merge with a **merge commit** only."
            echo ""
            echo "## Auto-merge"
            echo ""
            echo "This workflow enables **auto-merge with merge method MERGE** when checks allow. Do not squash."
            echo ""
            echo "Manual override:"
            echo ""
            echo '```'
            echo "gh pr merge <PR#> --merge --repo $REPO"
            echo '```'
            echo ""
            echo "Squash strips \`main\` parentage and re-breaks promotion-gate (failure class 2026-08-02 #2385/#2388)."
          } > /tmp/pr-body.md

          open_or_update_pr() {
            local existing closed
            existing=$(gh pr list --repo "$REPO" --base test --head chore/backflow-main-into-test --state open --json number --jq '.[0].number // empty') || return 1
            if [ -n "$existing" ]; then
              gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file /tmp/pr-body.md || return 1
              echo "Updated existing open backflow PR #$existing"
              echo "$existing" > /tmp/backflow-prnum
              return 0
            fi
            if gh pr create --repo "$REPO" --base test --head chore/backflow-main-into-test --title "$title" --body-file /tmp/pr-body.md 2>/tmp/pr-create.err; then
              gh pr list --repo "$REPO" --base test --head chore/backflow-main-into-test --state open --json number --jq '.[0].number' > /tmp/backflow-prnum
              echo "Created new backflow PR"
              return 0
            fi
            if grep -qi "already exists" /tmp/pr-create.err; then
              closed=$(gh pr list --repo "$REPO" --base test --head chore/backflow-main-into-test --state closed --json number,state --jq '[.[] | select(.state == "CLOSED")][0].number // empty') || return 1
              if [ -n "$closed" ]; then
                gh pr reopen "$closed" --repo "$REPO" || return 1
                gh pr edit "$closed" --repo "$REPO" --title "$title" --body-file /tmp/pr-body.md || return 1
                echo "$closed" > /tmp/backflow-prnum
                echo "Reopened + updated previously-closed backflow PR #$closed"
                return 0
              fi
            fi
            if grep -qi "not permitted to create or approve" /tmp/pr-create.err; then
              echo "::error title=Backflow PR auth blocked::App lacks Pull requests: write. Not retrying."
              cat /tmp/pr-create.err >&2
              exit 1
            fi
            cat /tmp/pr-create.err >&2
            return 1
          }

          attempt=0
          max=4
          until open_or_update_pr; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max" ]; then
              echo "::error title=Backflow PR open failed::Could not open/update fallback PR after $max attempts."
              exit 1
            fi
            echo "::warning::backflow PR open attempt $attempt/$max failed; retrying in $((attempt * 15))s..."
            sleep "$((attempt * 15))"
          done

          prnum=$(cat /tmp/backflow-prnum 2>/dev/null || true)
          if [ -z "$prnum" ]; then
            prnum=$(gh pr list --repo "$REPO" --base test --head chore/backflow-main-into-test --state open --json number --jq '.[0].number // empty' || true)
          fi
          if [ -z "$prnum" ]; then
            echo "::error title=Backflow PR number missing::Cannot label or auto-merge."
            exit 1
          fi

          # Do not apply backflow:merge-commit. That label is a human acknowledgment
          # ("I will merge with a merge commit, not squash"). The App stamping it
          # would forge the ack. The caller's merge-method guard passes this PR
          # when the author matches the authenticated App token's app-slug output
          # plus [bot], and the head is
          # chore/backflow-main-into-test. Hand-rolled backflows still need the
          # label. Ancestry mode still fails a squash after the fact.

          # Enable auto-merge with MERGE only (never squash/rebase).
          # Requires repo allow_auto_merge=true. Failure is a warning; body still documents --merge.
          if gh pr merge "$prnum" --repo "$REPO" --merge --auto 2>/tmp/auto-merge.err; then
            echo "Enabled auto-merge (merge method) on backflow PR #$prnum"
          else
            echo "::warning title=Auto-merge not enabled::$(cat /tmp/auto-merge.err). Ensure allow_auto_merge is true, then: gh pr merge $prnum --repo $REPO --merge --auto"
            echo "Manual: gh pr merge $prnum --repo $REPO --merge"
          fi

  # Required-check name when the caller job id is `backflow`:
  #   backflow / backflow-current
  # Fail other PRs into test while origin/test does not contain origin/main.
  # The auto-backflow PR itself must still merge.
  backflow-current:
    name: backflow-current
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Block merges onto test while test is behind main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [ "$HEAD_REF" = "chore/backflow-main-into-test" ]; then
            echo "backflow PR itself — allowing merge so ancestry can heal"
            exit 0
          fi

          exists=0
          git ls-remote --exit-code origin main >/dev/null 2>&1 || exists=$?
          if [ "$exists" -eq 2 ]; then
            echo "no origin/main — gate no-op (test-only repo)"
            exit 0
          elif [ "$exists" -ne 0 ]; then
            echo "::error title=backflow-current ls-remote failed::Could not query origin for 'main' (rc=$exists)."
            exit 1
          fi

          git fetch origin main test
          if git merge-base --is-ancestor origin/main origin/test; then
            echo "origin/test contains origin/main — other PRs may merge"
            exit 0
          fi

          behind=$(git rev-list --count origin/test..origin/main)
          echo "::error title=test is behind main::origin/test is $behind commit(s) behind origin/main. Wait for the configured backflow App to land (auto-merge, merge-commit only). Do not squash. Do not merge this PR until test contains main."
          exit 1
